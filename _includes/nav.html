<script>
  function toggleSidebar() {
    var sidebar = document.querySelector('.sidebar');
    var wrapper = document.querySelector('.layout-wrapper');
    if (sidebar) {
      sidebar.classList.toggle('sidebar-hidden');
      if (wrapper) wrapper.classList.toggle('sidebar-collapsed', sidebar.classList.contains('sidebar-hidden'));
      localStorage.setItem('portfolio-sidebar', sidebar.classList.contains('sidebar-hidden') ? 'hidden' : 'visible');
    }
  }
  (function() {
    var stored = localStorage.getItem('portfolio-sidebar');
    if (stored === 'hidden') {
      var sidebar = document.querySelector('.sidebar');
      var wrapper = document.querySelector('.layout-wrapper');
      if (sidebar) sidebar.classList.add('sidebar-hidden');
      if (wrapper) wrapper.classList.add('sidebar-collapsed');
    }
  })();

  function toggleTheme() {
    var html = document.documentElement;
    var current = html.getAttribute('data-theme');
    var next = current === 'dark' ? 'light' : 'dark';
    html.setAttribute('data-theme', next);
    localStorage.setItem('portfolio-theme', next);
  }
</script>
